# Checks the lines a pull request adds: https://github.com/Egoushka/agent-checks
name: agent-checks
on: pull_request
permissions:
  contents: read
jobs:
  agent-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: Egoushka/agent-checks@v0.1.1
        env:
          # This one branch removes the Telegram integration and its tests (spec S1); the allowance is inert on any other branch.
          AGENT_CHECKS_ALLOW: |-
            ${{ github.head_ref == 'feat/telegram-off-ntfy-push' && 'deleted-tests: the Telegram integration and its tests are removed (spec S1); deleted-assertions: assertions on Telegram messages are rewritten against the web path' || '' }}
